<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stone-paper-scissors</title>
  <style>
    body{
      background-color: rgb(25, 25, 25);
      color:white;
      font-family: Arial;
    }
    .title{
      font-size: 15px;
      font-weight:bold;
    }
    .move-icon{
      height:20px;
    }
    .btn-move{
      background: transparent;
      border:2px solid white;
      height: 70px;
      width: 70px;
      border-radius: 35px;
      margin-right: 10px;
    }
    .result{
        font-size:15px;
        margin-top: 40px;
    }
  </style>
</head>
<body>
  <p class = "title"> Stone Paper Scissors</p>
  <button class = "btn-move"
  onclick = "
  Game('Stone');
  "><img src = "photos/stone-emoji.png" class = "move-icon"></button>
  <button class = "btn-move"
  onclick = "
  Game('Paper');
  "><img src = "photos/paper-emoji.png" class ="move-icon"></button>
  <button class = "btn-move"
  onclick = "
  Game('Scissors');
  "
  ><img src = "photos/scissors-emoji.png" class = "move-icon"></button>
  <button
  onclick = "score.win = 0;score.loss = 0;score.tie = 0;
  localStorage.removeItem('score');
  scorehtml();
 "> Reset</button>


<p class = "result-html result"></p>
<p class = "move-html"></p>
<p class = "score-html"></p>

  <script>

    let score = JSON.parse(localStorage.getItem('score'))||
          {
            win:0,
            loss:0,
            tie:0
          };
    scorehtml();

  function Game(userChoice)
  {
    const randomnum = Math.random();
    let computerChoice = '';
  

  if(randomnum > 0 && randomnum < 1/3){
    computerChoice = 'stone';
  }
  else if(randomnum > 1/3 && randomnum < 2/3)
  {
     computerChoice = 'paper';
  }
  else{
     computerChoice = 'scissors';
  }
    let result = '';
  if(computerChoice === 'stone')
  {
    result = 'lose';
  }
  else if(computerChoice === 'paper')
  {
    result = 'win';
  }
  else{
    result = 'tie';
  }
  if(result === 'win')
  {
    score.win+=1;
  }
  else if(result === 'lose')
  {
    score.loss+=1;
  }
  else if(result === 'tie')
  {
    score.tie+=1;
  }
  document.querySelector('.result-html').innerHTML = `${result}`;

  document.querySelector('.move-html').innerHTML = `You
  <img src = "photos/${userChoice}-emoji.png" class = "move-icon">
  <img src = "photos/${computerChoice}-emoji.png" class ="move-icon">
  Computer`;

  localStorage.setItem('score' ,JSON.stringify(score));
  scorehtml();
  
  }
  function scorehtml()
  {
    document.querySelector('.score-html').innerHTML = 
    `win = ${score.win} , loss = ${score.loss} , tie = ${score.tie}`;
  }
  </script>
</body>
</html>
