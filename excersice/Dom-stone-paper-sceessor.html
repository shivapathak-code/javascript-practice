<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Paper Scissors</title>

  <style>
    body {
      background-color: rgb(25, 25, 25);
      color: white;
      font-family: Arial;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
    }

    .move-icon {
      height: 20px;
    }

    .btn-move {
      background: transparent;
      border: 2px solid white;
      height: 70px;
      width: 70px;
      border-radius: 35px;
      margin-right: 10px;
      cursor: pointer;
    }

    .result {
      font-size: 15px;
      margin-top: 40px;
    }

    /* Reset Popup */
    .reset-popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      background-color: white;
      color: black;

      padding: 25px;
      width: 280px;

      border-radius: 10px;
      text-align: center;

      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
    }

    .reset-popup p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .yes-btn,
    .no-btn {
      padding: 8px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .yes-btn {
      background-color: red;
      color: white;
    }

    .no-btn {
      background-color: gray;
      color: white;
    }

    .yes-btn:hover {
      background-color: darkred;
    }

    .no-btn:hover {
      background-color: #555;
    }
  </style>
</head>

<body>

  <p class="title">Stone Paper Scissors</p>

  <button class="btn-move button-Stone-dom">
    <img src="photos/stone-emoji.png" class="move-icon">
  </button>

  <button class="btn-move button-Paper-dom">
    <img src="photos/paper-emoji.png" class="move-icon">
  </button>

  <button class="btn-move button-Scissors-dom">
    <img src="photos/scissors-emoji.png" class="move-icon">
  </button>

  <button class="reset-btn-dom">
    Reset
  </button>

  <!-- Reset Confirmation Popup -->
  <div class="reset-popup">

    <p>Are you sure you want to reset the score?</p>

    <button class="yes-btn">
      Yes
    </button>

    <button class="no-btn">
      No
    </button>

  </div>

  <p class="result-html result"></p>

  <p class="move-html"></p>

  <p class="score-html"></p>

  <button class="auto-btn change-btn-text">
    AutoPlay
  </button>


  <script>

    let score = JSON.parse(localStorage.getItem('score')) || {
      win: 0,
      loss: 0,
      tie: 0
    };

    scorehtml();


    // =========================
    // AUTO PLAY
    // =========================

    document.querySelector('.auto-btn')
      .addEventListener('click', () => {
        autoplay();
      });


    document.body.addEventListener('keydown', (event) => {

      if (event.key === 'a') {
        autoplay();
      }

    });


    let intervalid;


    function autoplay() {

      const button = document.querySelector('.change-btn-text');

      if (button.innerHTML === 'AutoPlay') {

        intervalid = setInterval(function () {

          const randomnum = Math.random();

          let playermove = '';

          if (randomnum < 1 / 3) {
            playermove = 'Stone';
          }
          else if (randomnum < 2 / 3) {
            playermove = 'Paper';
          }
          else {
            playermove = 'Scissors';
          }

          Game(playermove);

        }, 1000);

        button.innerHTML = 'Stoped';

      }
      else {

        clearInterval(intervalid);

        button.innerHTML = 'AutoPlay';

      }

    }


    // =========================
    // MOVE BUTTONS
    // =========================

    document.querySelector('.button-Stone-dom')
      .addEventListener('click', () => {
        Game('Stone');
      });


    document.querySelector('.button-Paper-dom')
      .addEventListener('click', () => {
        Game('Paper');
      });


    document.querySelector('.button-Scissors-dom')
      .addEventListener('click', () => {
        Game('Scissors');
      });


    // Keyboard controls

    document.body.addEventListener('keydown', (event) => {

      if (event.key === 'r') {
        Game('Stone');
      }
      else if (event.key === 'p') {
        Game('Paper');
      }
      else if (event.key === 's') {
        Game('Scissors');
      }

    });


    // =========================
    // GAME FUNCTION
    // =========================

    function Game(userChoice) {

      const randomnum = Math.random();

      let computerChoice = '';


      // Computer choice

      if (randomnum < 1 / 3) {
        computerChoice = 'stone';
      }
      else if (randomnum < 2 / 3) {
        computerChoice = 'paper';
      }
      else {
        computerChoice = 'scissors';
      }


      // Game result

      let result = '';


      if (userChoice === 'Stone' && computerChoice === 'stone') {
        result = 'tie';
      }
      else if (userChoice === 'Stone' && computerChoice === 'paper') {
        result = 'lose';
      }
      else if (userChoice === 'Stone' && computerChoice === 'scissors') {
        result = 'win';
      }

      else if (userChoice === 'Paper' && computerChoice === 'stone') {
        result = 'win';
      }
      else if (userChoice === 'Paper' && computerChoice === 'paper') {
        result = 'tie';
      }
      else if (userChoice === 'Paper' && computerChoice === 'scissors') {
        result = 'lose';
      }

      else if (userChoice === 'Scissors' && computerChoice === 'stone') {
        result = 'lose';
      }
      else if (userChoice === 'Scissors' && computerChoice === 'paper') {
        result = 'win';
      }
      else if (userChoice === 'Scissors' && computerChoice === 'scissors') {
        result = 'tie';
      }


      // Update score

      if (result === 'win') {
        score.win += 1;
      }
      else if (result === 'lose') {
        score.loss += 1;
      }
      else if (result === 'tie') {
        score.tie += 1;
      }


      // Show result

      document.querySelector('.result-html').innerHTML = result;


      // Show moves

      document.querySelector('.move-html').innerHTML = `
        You
        <img src="photos/${userChoice.toLowerCase()}-emoji.png" class="move-icon">

        <img src="photos/${computerChoice}-emoji.png" class="move-icon">

        Computer
      `;


      // Save score

      localStorage.setItem('score', JSON.stringify(score));


      // Display score

      scorehtml();

    }


    // =========================
    // RESET POPUP
    // =========================

    const resetButton = document.querySelector('.reset-btn-dom');

    const resetPopup = document.querySelector('.reset-popup');

    const yesButton = document.querySelector('.yes-btn');

    const noButton = document.querySelector('.no-btn');


    // Reset button click

    resetButton.addEventListener('click', () => {

      resetPopup.style.display = 'block';

    });


    // Yes button

    yesButton.addEventListener('click', () => {

      score.win = 0;
      score.loss = 0;
      score.tie = 0;

      localStorage.removeItem('score');

      scorehtml();

      resetPopup.style.display = 'none';

    });


    // No button

    noButton.addEventListener('click', () => {

      resetPopup.style.display = 'none';

    });


    // =========================
    // BACKSPACE RESET
    // =========================

    document.body.addEventListener('keydown', (event) => {

      if (event.key === 'Backspace') {

        resetPopup.style.display = 'block';

      }

    });


    // =========================
    // SCORE DISPLAY
    // =========================

    function scorehtml() {

      document.querySelector('.score-html').innerHTML =
        `win = ${score.win}, loss = ${score.loss}, tie = ${score.tie}`;

    }

  </script>

</body>

</html>
