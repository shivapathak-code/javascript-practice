  <button onclick = "clickthe(this); " class = "is-toggled">Gaming</button>
  <button onclick = "clickthe(this); " class = "is-toggled">Music</button>
  <button onclick = "clickthe(this); " class = "is-toggled">Tech</button>
  <script>
    let activeButton;

function clickthe(button) {

    if (activeButton) {
        activeButton.classList.remove('on');
    }

    button.classList.add('on');

    activeButton = button;
}

    
  </script>
