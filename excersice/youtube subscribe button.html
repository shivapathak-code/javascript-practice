<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM project</title>
  <style>
    .class-dom{
      background-color: black;
      color:white;
      border:none;
      border-radius: 50px;
      padding-left: 14px;
      padding-right: 14px;
      padding-top: 10px;
      padding-bottom: 10px;
      cursor: pointer;
    }
    .is-subscribed{
      background-color: rgb(240, 240, 240);
      color:black;
    }
  </style>
</head>
<body>
  <p>Youtube Subscribe Button</p>
  <button onclick = "
    Subscribe();
  "class = "class-dom ">Subscribe</button>
  
  <script>
    function Subscribe()
    {
        const button = document.querySelector('.class-dom');
          if(button.innerText === 'Subscribe')
            {
              button.innerText = 'Subscribed';
              button.classList.add('is-subscribed');
            }
            else
            {
              button.innerText = 'Subscribe';
              button.classList.remove('is-subscribed');
            }
  
    }
  </script>
</body>
</html>
