  <title>excersice</title>
</head>
<body>
  <script>
    
    for(let i = 1;i<=20;i++)
      {
        if(i % 3 === 0)
      {
        console.log('Fizz');
      }
       if(i % 5 === 0)
      {
        console.log('Buzz');
      }
      if(i % 3 === 0 && i % 5 === 0)
      {
        console.log('fizzbuzz');
      }
      else
      {
        console.log(i);
      }
  }
  </script>
