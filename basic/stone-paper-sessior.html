<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stone-paper-scissors</title>
  <style>
    body{
      background-color: rgb(25, 25, 25);
    }
  </style>
</head>
<body>
  <p> Stone Paper Scissors</p>
  <button 
  onclick = "
  Game('Stone');
  ">Stone</button>
  <button
  onclick = "
  Game('Paper');
  ">Paper</button>
  <button
  onclick = "
  Game('Scissors');
  "
  >Scissors</button>
  <button
  onclick = "score.win = 0;score.loss = 0;score.tie = 0;
  localStorage.removeItem('score');
  alert('Reset your game')
  
  
  ">

  Reset</button>
  <script>

    let score = JSON.parse(localStorage.getItem('score'))||
          {
            win:0,
            loss:0,
            tie:0
          };
    

  function Game(userChoice)
  {
    const randomnum = Math.random();
    let computerChoice = '';
  

  if(randomnum > 0 && randomnum < 1/3){
    computerChoice = 'stone';
  }
  else if(randomnum > 1/3 && randomnum < 2/3)
  {
     computerChoice = 'paper';
  }
  else{
     computerChoice = 'scissors';
  }
    let result = '';
  if(computerChoice === 'stone')
  {
    result = 'lose';
  }
  else if(computerChoice === 'paper')
  {
    result = 'win';
  }
  else{
    result = 'tie';
  }
  if(result === 'win')
  {
    score.win+=1;
  }
  else if(result === 'lose')
  {
    score.loss+=1;
  }
  else if(result === 'tie')
  {
    score.tie+=1;
  }
  localStorage.setItem('score' ,JSON.stringify(score));

  console.log(alert(`You chosse ${userChoice} , Computer chose ${computerChoice} , you have ${result} the match
  win = ${score.win} , loss = ${score.loss} , tie = ${score.tie}`));
  }
  </script>
</body>
</html>
