<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>coin flip game</title>
</head>
<body>
  <p>coin flip game</p>
  <button onclick = "
      flipCoin();
">flip coin</button>
<button onclick = "counting.HeadCount = 0; counting.TailCount = 0;
      localStorage.removeItem('counting');
      alert(`Reset your game`);">Reset</button>
<script>
   let counting = JSON.parse(localStorage.getItem('counting')) || {
      HeadCount:0,
      TailCount:0

  };
  function flipCoin()
  {
    const randomNum = Math.random();
    let result = '';
    if(randomNum < 0.5)
      {
        result = 'Heads';
      }
      else
      {
        result = 'Tails';
      }
      let gusse = 'Heads';
      if(result === gusse)
      {
        counting.HeadCount+=1;
        localStorage.setItem('counting',JSON.stringify(counting));
        console.log(alert(`You guessed ${gusse} and the coin flip result is ${result}, you have won the game , countHead ${counting.HeadCount} , countTail ${counting.TailCount}`));
      }
      else
      {
        counting.TailCount+=1;
        localStorage.setItem('counting',JSON.stringify(counting));
        console.log(alert(`You guessed ${gusse} and the coin flip result is ${result}, you have lost the game , countHead ${counting.HeadCount} , countTail ${counting.TailCount}`));
      }
  }

</script>
</body>
</html>
