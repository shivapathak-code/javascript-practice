<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Calculator</title>

  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial;
    }

    .calculator {
      width: 220px;
    }

    .p-text {
      font-size: 30px;
      min-height: 40px;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 45px);
      gap: 8px;
    }

    .btn,
    .btn1 {
      width: 45px;
      height: 45px;
      border: none;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    .btn {
      background-color: rgb(54, 53, 53);
    }

    .btn1 {
      background-color: rgb(243, 155, 2);
    }

    .clear {
      width: 45px;
      height: 45px;
      border: none;
      padding: 3px;
      border-radius: 50%;
      font-size: 13px;
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <h1>Calculator</h1>

    <p class="p-text"></p>

    <div class="buttons">

      <button
        onclick="calculation += '1'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        1
      </button>

      <button
        onclick="calculation += '2'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        2
      </button>

      <button
        onclick="calculation += '3'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        3
      </button>

      <button
        onclick="calculation += '+'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn1">
        +
      </button>


      <button
        onclick="calculation += '4'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        4
      </button>

      <button
        onclick="calculation += '5'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        5
      </button>

      <button
        onclick="calculation += '6'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        6
      </button>

      <button
        onclick="calculation += '-'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn1">
        -
      </button>


      <button
        onclick="calculation += '7'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        7
      </button>

      <button
        onclick="calculation += '8'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        8
      </button>

      <button
        onclick="calculation += '9'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        9
      </button>

      <button
        onclick="calculation += '*'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn1">
        *
      </button>


      <button
        onclick="calculation += '0'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        0
      </button>

      <button
        onclick="calculation += '.'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        .
      </button>

      <button
        onclick="calculation = eval(calculation); document.querySelector('.p-text').innerHTML = calculation;"
        class="btn">
        =
      </button>

      <button
        onclick="calculation += '/'; document.querySelector('.p-text').innerHTML = calculation;"
        class="btn1">
        /
      </button>


      <button
        onclick="calculation = ''; document.querySelector('.p-text').innerHTML = '';"
        class="btn clear">
        Clear
      </button>

    </div>

  </div>


  <script>
    let calculation = "";
  </script>

</body>
</html>
